openapi: 3.0.3
info:
  title: Instant Mechanic Dashboard API
  version: 1.0.0
  description: >
    Backend API for the Instant Mechanic Live Vehicle Service Operations Dashboard.
    Provides dashboard stats, bookings, mechanics and customers data, plus
    real-time updates over Socket.IO on the same origin.
servers:
  - url: /api
    description: Relative to wherever this API is deployed
tags:
  - name: Dashboard
  - name: Bookings
  - name: Mechanics
  - name: Customers

paths:
  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Get top-line operational stats
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      totalBookings: { type: integer }
                      todaysBookings: { type: integer }
                      completedBookings: { type: integer }
                      pendingBookings: { type: integer }
                      cancelledBookings: { type: integer }
                      totalRevenue: { type: number }
                      activeMechanics: { type: integer }
                      totalMechanics: { type: integer }
                      newCustomers: { type: integer }

  /dashboard/analytics:
    get:
      tags: [Dashboard]
      summary: Get chart data for bookings, revenue and breakdowns
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30 }
          description: Number of trailing days to include
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      bookingsOverTime:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string }
                            count: { type: integer }
                      revenueOverTime:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string }
                            revenue: { type: number }
                      statusBreakdown:
                        type: array
                        items:
                          type: object
                          properties:
                            status: { type: string }
                            count: { type: integer }
                      serviceBreakdown:
                        type: array
                        items:
                          type: object
                          properties:
                            category: { type: string }
                            count: { type: integer }
                            revenue: { type: number }

  /bookings:
    get:
      tags: [Bookings]
      summary: List bookings with search, filter, sort and pagination
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
          description: Full-text search across booking ID and vehicle details
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ASSIGNED, ON_THE_WAY, COMPLETED, CANCELLED]
        - name: mechanic
          in: query
          schema: { type: string }
          description: Mechanic ObjectId
        - name: customer
          in: query
          schema: { type: string }
          description: Customer ObjectId
        - name: sortBy
          in: query
          schema: { type: string, enum: [createdAt, scheduledAt, amount, status, bookingId] }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Paginated list of bookings
    post:
      tags: [Bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, service, vehicle, amount, scheduledAt]
              properties:
                customer: { type: string, description: Customer ObjectId }
                mechanic: { type: string, nullable: true, description: Mechanic ObjectId }
                service: { type: string, description: Service ObjectId }
                vehicle:
                  type: object
                  properties:
                    brand: { type: string }
                    model: { type: string }
                    registrationNumber: { type: string }
                amount: { type: number }
                scheduledAt: { type: string, format: date-time }
      responses:
        "201":
          description: Booking created

  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get a single booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Booking detail
        "404":
          description: Not found

  /bookings/{id}/status:
    patch:
      tags: [Bookings]
      summary: Update a booking's status (drives the live Socket.IO update)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, ASSIGNED, ON_THE_WAY, COMPLETED, CANCELLED]
      responses:
        "200":
          description: Updated booking
        "400":
          description: Invalid status transition

  /mechanics:
    get:
      tags: [Mechanics]
      summary: List mechanics with their current status and job counts
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, BUSY, OFFLINE]
      responses:
        "200":
          description: Paginated list of mechanics

  /mechanics/{id}:
    get:
      tags: [Mechanics]
      summary: Get a single mechanic with recent bookings
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Mechanic detail
        "404":
          description: Not found

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of customers

  /customers/{id}:
    get:
      tags: [Customers]
      summary: Get a single customer with their booking history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer detail
        "404":
          description: Not found
